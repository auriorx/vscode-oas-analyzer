CorrelationId:
  description: |
    An identifier to provide in order to track your request.
  in: header
  required: false
  name: x-correlation-id
  schema:
    type: string
    example: 661077bb-375f-4500-b5aa-0ef18807add6
PaginationLimit:
  name: limit
  in: query
  required: false
  description: |
    Maximum number of items to return.
    If omitted, the server applies a default.
  schema:
    type: integer
    format: int32
    minimum: 1
    maximum: 200
    default: 20
    example: 20
PaginationOffset:
  name: offset
  in: query
  required: false
  description: |
    Number of items to skip before starting to collect the result set.
  schema:
    type: integer
    format: int32
    minimum: 0
    default: 0
    example: 0
